name: Test Backend

on:
  workflow_call:

jobs:
  test-backend:
    name: Run Backend Tests
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Create empty .env
        run: touch Backend/.env

      - name: Cache SwiftPM artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm/
            Backend/.build
          key: ${{ runner.os }}-spm-Backend-xcode-26.6-${{ github.ref_name }}-${{ hashFiles('Backend/Package.swift', 'Backend/Package.resolved', 'Shared/Package.swift', 'Shared/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-Backend-xcode-26.6-${{ github.ref_name }}-
            ${{ runner.os }}-spm-Backend-xcode-26.6-

      - name: Resolve Backend package dependencies
        run: swift package resolve
        working-directory: Backend

      - name: Build & Test
        run: |
          set -o pipefail
          mkdir -p build/reports
          swift test \
            --package-path Backend \
            --filter BackendTests \
            --skip CognitoAuthManagerTest \
            --skip DynamoDBStoreTest \
            --skip ProgramMigrator \
            --skip RouteMigrator \
            --enable-code-coverage \
            | tee build/reports/backend-test.log

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: Backend/.build/debug/codecov/

      - name: Print Test Summary
        if: always()
        run: |
          echo "===== Backend Swift Package Test Summary ====="
          if [ -f build/reports/backend-test.log ]; then
            tail -n 80 build/reports/backend-test.log
          else
            echo "Backend test log was not created."
          fi
