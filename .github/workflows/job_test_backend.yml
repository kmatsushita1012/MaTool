name: Test Backend

on:
  workflow_call:

jobs:
  test-backend:
    name: Run Backend Tests
    runs-on: ubuntu-24.04
    container:
      image: swift:6.3.3-noble
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Backend build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            python3 \
            libssl-dev \
            libxml2-dev \
            libcurl4-openssl-dev
          rm -rf /var/lib/apt/lists/*

      - name: Create empty .env
        run: touch Backend/.env

      # .buildはAWS SDK等の成果物が数GBになるため、Actionsキャッシュには保存しない。
      # このジョブは毎回ビルドし、容量は頻繁なBackendデプロイ用キャッシュに優先配分する。
      - name: Resolve Backend package dependencies
        run: swift package resolve
        working-directory: Backend

      - name: Build & Test
        id: test
        run: |
          set -o pipefail
          mkdir -p build/reports
          swift test \
            --package-path Backend \
            --filter BackendTests \
            --skip CognitoAuthManagerTest \
            --skip DynamoDBStoreTest \
            --skip ProgramMigrator \
            --skip RouteMigrator \
            --no-parallel \
            --enable-code-coverage \
            --xunit-output="$(pwd)/build/reports/backend-test-results.xml" \
            | tee build/reports/backend-test.log

      - name: Export Backend file coverage
        if: always()
        run: |
          set -euo pipefail
          mkdir -p build/reports
          coverage_json="$(swift test --package-path Backend --show-codecov-path)"
          # SwiftPMはテスト失敗時にJSONを書き出さないため、プロファイルから直接復元する。
          if [ ! -f "$coverage_json" ]; then
            codecov_dir="$(dirname "$coverage_json")"
            mapfile -d '' profiles < <(find "$codecov_dir" -maxdepth 1 -type f -name '*.profraw' -print0)
            if [ "${#profiles[@]}" -eq 0 ]; then
              echo "No code coverage profiles were generated" >&2
              exit 1
            fi
            llvm-profdata merge -sparse "${profiles[@]}" -o "$codecov_dir/default.profdata"
            test_binary="$(find Backend/.build -type f -name '*PackageTests.xctest' | head -n 1)"
            if [ -z "$test_binary" ]; then
              echo "Backend test binary was not found" >&2
              exit 1
            fi
            llvm-cov export -instr-profile="$codecov_dir/default.profdata" "$test_binary" > "$coverage_json"
          fi
          test -s "$coverage_json"
          cp "$coverage_json" build/reports/backend-coverage.json

      - name: Audit Backend per-file line coverage
        if: always()
        run: |
          python3 ci_scripts/audit_unit_coverage.py \
            --input build/reports/backend-coverage.json \
            --scope backend \
            --manifest ci_scripts/unit_coverage_targets.txt \
            --output build/reports/backend-coverage-files.csv \
            --strict \
            --show-all \
            --full-line-manifest ci_scripts/unit_coverage_full_targets.txt

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            Backend/.build/debug/codecov/
            build/reports/backend-coverage.json
            build/reports/backend-coverage-files.csv

      - name: Print Test Summary
        if: always()
        run: |
          python3 .github/scripts/print_test_summary.py \
            --xunit "$(pwd)/build/reports/backend-test-results.xml" \
            --title Backend \
            --platform Linux \
            --device "GitHub Actions Runner" \
            --os-version "Ubuntu 24.04 / Swift 6.3.3" \
            --test-outcome "${{ steps.test.outcome }}"
