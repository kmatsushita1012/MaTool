name: Test Backend

on:
  workflow_call:

jobs:
  test-backend:
    name: Run Backend Tests
    runs-on: ubuntu-24.04
    container:
      image: swift:6.3.3-noble
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Backend build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            python3 \
            libssl-dev \
            libxml2-dev \
            libcurl4-openssl-dev
          rm -rf /var/lib/apt/lists/*

      - name: Create empty .env
        run: touch Backend/.env

      - name: Cache SwiftPM artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/org.swift.swiftpm/
            Backend/.build
          key: ${{ runner.os }}-spm-Backend-swift-6.3.3-${{ github.ref_name }}-${{ hashFiles('Backend/Package.swift', 'Backend/Package.resolved', 'Shared/Package.swift', 'Shared/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-Backend-swift-6.3.3-${{ github.ref_name }}-
            ${{ runner.os }}-spm-Backend-swift-6.3.3-

      - name: Resolve Backend package dependencies
        run: swift package resolve
        working-directory: Backend

      - name: Build & Test
        id: test
        run: |
          set -o pipefail
          mkdir -p build/reports
          swift test \
            --package-path Backend \
            --filter BackendTests \
            --skip CognitoAuthManagerTest \
            --skip DynamoDBStoreTest \
            --skip ProgramMigrator \
            --skip RouteMigrator \
            --no-parallel \
            --enable-code-coverage \
            --xunit-output=build/reports/backend-test-results.xml \
            | tee build/reports/backend-test.log

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: Backend/.build/debug/codecov/

      - name: Print Test Summary
        if: always()
        run: |
          python3 .github/scripts/print_test_summary.py \
            --xunit build/reports/backend-test-results.xml \
            --title Backend \
            --platform Linux \
            --device "GitHub Actions Runner" \
            --os-version "Ubuntu 24.04 / Swift 6.3.3" \
            --test-outcome "${{ steps.test.outcome }}"
