name: Test Shared

on:
  workflow_call:

jobs:
  test-shared:
    name: Run Shared Tests
    runs-on: ubuntu-24.04
    container:
      image: swift:6.3.3-noble
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # .buildはAWS SDK等の成果物が数GBになるため、Actionsキャッシュには保存しない。
      # このジョブは毎回ビルドし、容量は頻繁なBackendデプロイ用キャッシュに優先配分する。
      - name: Resolve Shared package dependencies
        run: swift package resolve
        working-directory: Shared

      - name: Install Python for Test Summary
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3
          rm -rf /var/lib/apt/lists/*

      - name: Build & Test
        id: test
        run: |
          set -o pipefail
          mkdir -p build/reports
          swift test \
            --package-path Shared \
            --filter '^SharedTests\.' \
            --enable-code-coverage \
            --xunit-output="$(pwd)/build/reports/shared-test-results.xml" \
            | tee build/reports/shared-test.log

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-test-results
          path: Shared/.build/debug/codecov/

      - name: Print Test Summary
        if: always()
        run: |
          python3 .github/scripts/print_test_summary.py \
            --xunit "$(pwd)/build/reports/shared-test-results.xml" \
            --title Shared \
            --platform Linux \
            --device "GitHub Actions Runner" \
            --os-version "Ubuntu 24.04 / Swift 6.3.3" \
            --test-outcome "${{ steps.test.outcome }}"
