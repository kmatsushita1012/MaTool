name: Test Shared

on:
  workflow_call:

jobs:
  test-shared:
    name: Run Shared Tests
    runs-on: ubuntu-24.04
    container:
      image: swift:6.3.3-noble
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # .buildはAWS SDK等の成果物が数GBになるため、Actionsキャッシュには保存しない。
      # このジョブは毎回ビルドし、容量は頻繁なBackendデプロイ用キャッシュに優先配分する。
      - name: Resolve Shared package dependencies
        run: swift package resolve
        working-directory: Shared

      - name: Build & Test
        run: |
          set -o pipefail
          mkdir -p build/reports
          swift test \
            --package-path Shared \
            --filter '^SharedTests\.' \
            --enable-code-coverage \
            | tee build/reports/shared-test.log

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-test-results
          path: Shared/.build/debug/codecov/

      - name: Print Test Summary
        if: always()
        run: |
          echo "===== Shared Swift Package Test Summary ====="
          if [ -f build/reports/shared-test.log ]; then
            tail -n 80 build/reports/shared-test.log
          else
            echo "Shared test log was not created."
          fi
