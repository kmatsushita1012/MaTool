name: Test Shared

on:
  workflow_call:

jobs:
  test-shared:
    name: Run Shared Tests
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Cache SwiftPM artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm/
            Shared/.build
          key: ${{ runner.os }}-spm-Shared-xcode-26.6-${{ github.ref_name }}-${{ hashFiles('Shared/Package.swift', 'Shared/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-Shared-xcode-26.6-${{ github.ref_name }}-
            ${{ runner.os }}-spm-Shared-xcode-26.6-

      - name: Resolve Shared package dependencies
        run: swift package resolve
        working-directory: Shared

      - name: Build & Test
        run: |
          set -o pipefail
          mkdir -p build/reports
          swift test \
            --package-path Shared \
            --filter '^SharedTests\.' \
            --enable-code-coverage \
            | tee build/reports/shared-test.log

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-test-results
          path: Shared/.build/debug/codecov/

      - name: Print Test Summary
        if: always()
        run: |
          echo "===== Shared Swift Package Test Summary ====="
          if [ -f build/reports/shared-test.log ]; then
            tail -n 80 build/reports/shared-test.log
          else
            echo "Shared test log was not created."
          fi
