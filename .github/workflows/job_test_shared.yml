name: Test Shared

on:
  workflow_call:

jobs:
  test-shared:
    name: Run Shared Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Swift 6.3.3
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.3.3"

      - name: Cache SwiftPM artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/org.swift.swiftpm/
            Shared/.build
          key: ${{ runner.os }}-spm-Shared-swift-6.3.3-${{ github.ref_name }}-${{ hashFiles('Shared/Package.swift', 'Shared/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-Shared-swift-6.3.3-${{ github.ref_name }}-
            ${{ runner.os }}-spm-Shared-swift-6.3.3-

      - name: Resolve Shared package dependencies
        run: swift package resolve
        working-directory: Shared

      - name: Build & Test
        run: |
          set -o pipefail
          mkdir -p build/reports
          swift test \
            --package-path Shared \
            --filter '^SharedTests\.' \
            --enable-code-coverage \
            | tee build/reports/shared-test.log

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-test-results
          path: Shared/.build/debug/codecov/

      - name: Print Test Summary
        if: always()
        run: |
          echo "===== Shared Swift Package Test Summary ====="
          if [ -f build/reports/shared-test.log ]; then
            tail -n 80 build/reports/shared-test.log
          else
            echo "Shared test log was not created."
          fi
