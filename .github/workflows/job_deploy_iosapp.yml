name: Deploy iOS App

on:
  workflow_call:

jobs:
  release-archive:
    runs-on: macos-26
    env:
      IOS_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Create amplifyconfiguration.json
        env:
          AMPLIFYCONFIGURATION_JSON_B64: ${{ secrets.AMPLIFYCONFIGURATION_JSON_B64 }}
        run: |
          echo "$AMPLIFYCONFIGURATION_JSON_B64" | base64 --decode > iOSApp/amplifyconfiguration.json

      - name: Cache SPM checkouts
        uses: actions/cache@v4
        with:
          path: iOSApp/.sourcePackages
          key: ${{ runner.os }}-spm-iOSApp-xcode26.6-${{ hashFiles('MaTool.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'iOSApp/MaTool.xcodeproj/project.pbxproj', 'Shared/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-iOSApp-xcode26.6-

      - name: Cache Release build artifacts
        uses: actions/cache@v4
        with:
          path: iOSApp/.derivedData/Build
          key: ${{ runner.os }}-derived-iOSApp-xcode26.6-release-${{ hashFiles('MaTool.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'iOSApp/MaTool.xcodeproj/project.pbxproj', 'Shared/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-derived-iOSApp-xcode26.6-release-

      - name: Create iOS config files
        env:
          MATOOL_API_BASE_URL: ${{ secrets.MATOOL_API_BASE_URL }}
          MATOOL_USER_GUIDE_URL: ${{ secrets.MATOOL_USER_GUIDE_URL }}
          MATOOL_CONTACT_URL: ${{ secrets.MATOOL_CONTACT_URL }}
          MATOOL_ADMOB_APP_ID: ${{ secrets.MATOOL_ADMOB_APP_ID }}
          MATOOL_PUBLIC_MAP_INTERSTITIAL_AD_UNIT_ID: ${{ secrets.MATOOL_PUBLIC_MAP_INTERSTITIAL_AD_UNIT_ID }}
          MATOOL_PUBLIC_MAP_BANNER_AD_UNIT_ID: ${{ secrets.MATOOL_PUBLIC_MAP_BANNER_AD_UNIT_ID }}
        run: |
          chmod +x .github/scripts/generate_ios_xcconfig.sh
          ./.github/scripts/generate_ios_xcconfig.sh

      - name: Create Private Key
        run: |
          mkdir -p private_keys
          echo -n '${{ secrets.APPLE_API_KEY_BASE64 }}' | base64 --decode > ./private_keys/AuthKey_${{ secrets.APPLE_API_ISSUE_ID }}.p8

      - name: Build
        run: |
          xcodebuild archive \
            -project iOSApp/MaTool.xcodeproj \
            -scheme iOSApp \
            -archivePath iOSApp/MaTool.xcarchive \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath iOSApp/.derivedData \
            -clonedSourcePackagesDirPath iOSApp/.sourcePackages \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
            -allowProvisioningUpdates \
            -authenticationKeyPath `pwd`/private_keys/AuthKey_${{ secrets.APPLE_API_ISSUE_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APPLE_API_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APPLE_API_ISSUE_ID }} \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=SN9A65C32S \
            ENABLE_SWIFT_MACROS=YES

      - name: Create ExportOptions.plist
        run: |
          echo '${{ secrets.EXPORT_OPTIONS }}' > ExportOptions.plist
          if /usr/libexec/PlistBuddy -c 'Print :manageAppVersionAndBuildNumber' ExportOptions.plist >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c 'Set :manageAppVersionAndBuildNumber false' ExportOptions.plist
          else
            /usr/libexec/PlistBuddy -c 'Add :manageAppVersionAndBuildNumber bool false' ExportOptions.plist
          fi
          cat ExportOptions.plist

      - name: Export IPA
        run: |
          xcodebuild -exportArchive -archivePath iOSApp/MaTool.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath build/export -allowProvisioningUpdates -authenticationKeyPath `pwd`/private_keys/AuthKey_${{ secrets.APPLE_API_ISSUE_ID }}.p8 -authenticationKeyID ${{ secrets.APPLE_API_KEY_ID }} -authenticationKeyIssuerID ${{ secrets.APPLE_API_ISSUE_ID }}

      - name: Verify Exported Build Number
        run: |
          /usr/bin/unzip -p build/export/MaTool.ipa Payload/MaTool.app/Info.plist > "$RUNNER_TEMP/ExportedInfo.plist"
          ACTUAL_BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$RUNNER_TEMP/ExportedInfo.plist")
          if [ "$ACTUAL_BUILD_NUMBER" != "$IOS_BUILD_NUMBER" ]; then
            echo "::error::Exported CFBundleVersion ($ACTUAL_BUILD_NUMBER) does not match GitHub Actions build number ($IOS_BUILD_NUMBER)."
            exit 1
          fi
          echo "Verified exported CFBundleVersion: $ACTUAL_BUILD_NUMBER"

      - name: Upload to App Store Connect
        run: |
          xcrun altool --upload-app -f build/export/MaTool.ipa -t ios -u ${{ secrets.APPLE_ID }} -p ${{ secrets.APP_SPECIFIC_PASSWORD }} --type ios
