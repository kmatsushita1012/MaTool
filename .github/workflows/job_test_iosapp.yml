name: Test iOS App

on:
  workflow_call:

jobs:
  test-iosapp-library:
    name: Run iOS App Tests
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode 27
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27"

      - name: Create amplifyconfiguration.json
        env:
          AMPLIFYCONFIGURATION_JSON_B64: ${{ secrets.AMPLIFYCONFIGURATION_JSON_B64 }}
        run: |
          echo "$AMPLIFYCONFIGURATION_JSON_B64" | base64 --decode > iOSApp/amplifyconfiguration.json

      - name: Cache SPM checkouts
        uses: actions/cache@v4
        with:
          # Git cloneの再取得を避け、生成可能なcheckoutsやビルド成果物は保存しない。
          path: iOSApp/.sourcePackages/repositories
          key: ${{ runner.os }}-spm-iOSApp-xcode27-${{ hashFiles('MaTool.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Shared/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-iOSApp-xcode27-

      - name: Resolve packages
        env:
          MATOOL_API_BASE_URL: ${{ secrets.MATOOL_API_BASE_URL }}
          MATOOL_USER_GUIDE_URL: ${{ secrets.MATOOL_USER_GUIDE_URL }}
          MATOOL_CONTACT_URL: ${{ secrets.MATOOL_CONTACT_URL }}
        run: |
          chmod +x .github/scripts/generate_ios_xcconfig.sh
          ./.github/scripts/generate_ios_xcconfig.sh
          xcodebuild \
            -project iOSApp/MaTool.xcodeproj \
            -scheme iOSApp \
            -clonedSourcePackagesDirPath iOSApp/.sourcePackages \
            -skipPackagePluginValidation \
            -resolvePackageDependencies

      - name: Select latest plain iPhone simulator
        id: sim
        shell: bash
        run: |
          set -euxo pipefail

          DESTS="$(
            xcodebuild \
              -project iOSApp/MaTool.xcodeproj \
              -scheme iOSApp \
              -clonedSourcePackagesDirPath iOSApp/.sourcePackages \
              -showdestinations \
              -skipMacroValidation \
              -skipPackagePluginValidation
          )"

          DEST_LINE="$(
            printf '%s\n' "$DESTS" | awk '
              /platform:iOS Simulator/ && /name:iPhone / &&
              $0 !~ /Pro/ && $0 !~ /Max/ && $0 !~ /Air/ && $0 !~ /16e/ {
                match($0, /OS:[0-9.]+/)
                os = substr($0, RSTART + 3, RLENGTH - 3)
                print os " " $0
              }
            ' | sort -V | tail -1 | cut -d' ' -f2-
          )"

          [ -n "$DEST_LINE" ]

          DESTINATION_ID="$(printf '%s\n' "$DEST_LINE" | sed -E 's/.*id:([^,}]*).*/\1/')"
          DEVICE_NAME="$(printf '%s\n' "$DEST_LINE" | sed -E 's/.*name:([^}]*)[[:space:]]*}/\1/' | xargs)"
          OS_VERSION="$(printf '%s\n' "$DEST_LINE" | sed -E 's/.*OS:([^,}]+).*/\1/' | xargs)"

          echo "Selected simulator:"
          echo "  Device: $DEVICE_NAME"
          echo "  OS:     iOS $OS_VERSION"
          echo "  UDID:   $DESTINATION_ID"

          echo "DESTINATION_ID=$DESTINATION_ID" >> "$GITHUB_OUTPUT"

      - name: Build&Test
        id: test
        run: |
          set -o pipefail
          mkdir -p build/reports
          xcodebuild \
            -project iOSApp/MaTool.xcodeproj \
            -scheme iOSApp \
            -destination "id=${{ steps.sim.outputs.DESTINATION_ID }}" \
            -configuration Debug \
            -derivedDataPath iOSApp/.derivedData \
            -clonedSourcePackagesDirPath iOSApp/.sourcePackages \
            -enableCodeCoverage YES \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_SWIFT_MACROS=YES \
            test \
            | tee build/reports/test.log | xcpretty

      - name: Upload Test Results
        id: upload-tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: iOSApp/.derivedData/Logs/Test/*.xcresult

      - name: Print Test Summary
        if: always()
        run: |
          set -euo pipefail
          mkdir -p build/reports
          xcresult_path=""
          if [ -d iOSApp/.derivedData/Logs/Test ]; then
            xcresult_path=$(find iOSApp/.derivedData/Logs/Test -type d -name "*.xcresult" | sort | tail -n 1)
          fi
          if [ -n "$xcresult_path" ] && xcrun xcresulttool get test-results summary --path "$xcresult_path" --format json > build/reports/test_summary.json; then
            python3 .github/scripts/print_test_summary.py \
              --xcresult-json build/reports/test_summary.json \
              --test-outcome "${{ steps.test.outcome }}"
          else
            python3 .github/scripts/print_test_summary.py \
              --title iOSApp \
              --platform "iOS Simulator" \
              --device Unknown \
              --os-version Unknown \
              --test-outcome "${{ steps.test.outcome }}"
          fi
